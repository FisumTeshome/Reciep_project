version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: minabpro_postgres
    environment:
      POSTGRES_DB: minabpro_recipes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minabpro_recipes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - minabpro_network

  # Hasura GraphQL Engine
  hasura:
    image: hasura/graphql-engine:latest
    container_name: minabpro_hasura
    ports:
      - "8081:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:password@postgres:5432/minabpro_recipes
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: your-hasura-admin-secret
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256", "key":"your-super-secret-jwt-key-here-change-in-production"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minabpro_network

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minabpro_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=minabpro_recipes
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - JWT_SECRET=your-super-secret-jwt-key-here-change-in-production
      - HASURA_GRAPHQL_ADMIN_SECRET=your-hasura-admin-secret
      - HASURA_GRAPHQL_ENDPOINT=http://hasura:8080/v1/graphql
    depends_on:
      postgres:
        condition: service_healthy
      hasura:
        condition: service_started
    restart: unless-stopped
    networks:
      - minabpro_network

  # Nuxt 3 Frontend (run dev server in a Node container with bind mount)
  frontend:
    image: node:18
    container_name: minabpro_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_API_URL=http://localhost:8080
      - NUXT_PUBLIC_HASURA_URL=http://localhost:8081
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
      hasura:
        condition: service_started
    restart: unless-stopped
    networks:
      - minabpro_network

volumes:
  postgres_data:

networks:
  minabpro_network:
    driver: bridge